services:
  couchdb:
    image: couchdb:3.3
    container_name: elenko-couchdb
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5984:5984"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /opt/couchdb/etc/local.d
        printf '%s\n' '[couchdb]' 'single_node = true' > /opt/couchdb/etc/local.d/10-single-node.ini
        exec tini -- /docker-entrypoint.sh /opt/couchdb/bin/couchdb
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      # Default / amd64: use curl. Raspberry armv7 uses docker-compose.armv7.yml, which overrides
      # this with an Erlang probe (that image has `erl` on PATH but no curl).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5984/ >/dev/null"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 60s

  app:
    build: .
    container_name: elenko-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      COUCHDB_URL: http://admin:admin@couchdb:5984
      COUCHDB_DB: elenko
      PORT: 3000
      FLOW_LOG_FILE: /app/logs/elenko.log
    
    volumes:
      - ./logs:/app/logs

    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb_data:
